name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Demo smoke test
        run: python demo.py
      - name: ELSE demo smoke test
        run: |
          python else/demo.py --image examples/sample_input.png --method else_single
          python else/demo.py --image examples/sample_input.png --method else_double
      - name: Verify console entry point
        run: gdsd-demo --percentile 90
