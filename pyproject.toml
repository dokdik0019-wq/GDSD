[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdsd-edge-detector"
version = "2.0.0"
description = "GDSD edge detector: least-squares quadratic surface fit with zero-crossing edge response"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Thapakorn Sinlapakorn", email = "thapakorn_sinlapakorn@kkumail.com" },
]
keywords = ["edge-detection", "computer-vision", "quadratic-fit", "image-processing", "opencv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gdsd-demo = "demo:main"

[tool.setuptools]
py-modules = ["gdsd", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
